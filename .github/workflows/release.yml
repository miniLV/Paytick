name: Build and Release Paytick

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create a temporary keychain
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import the certificate to the keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          echo "Available Code Signing Identities:"
          security find-identity -v -p codesigning || true

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Paytick/Paytick.xcodeproj \
            -scheme Paytick

      - name: Build and Archive
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project Paytick/Paytick.xcodeproj \
            -scheme Paytick \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath ./build/Paytick.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            SKIP_INSTALL=NO

      - name: Inspect Archive
        run: |
          echo "=== Archive Structure ==="
          ls -la ./build/Paytick.xcarchive/
          ls -la ./build/Paytick.xcarchive/Products/ || true
          ls -la ./build/Paytick.xcarchive/Products/Applications/ || true
          
          ARCHIVE_INFO="./build/Paytick.xcarchive/Info.plist"
          if [ -f "$ARCHIVE_INFO" ]; then
            echo "=== Archive Info.plist ==="
            cat "$ARCHIVE_INFO"
          fi

      - name: Copy App from Archive
        run: |
          # Skip xcodebuild -exportArchive which has issues with SPM frameworks
          # Instead, copy the app directly from the archive
          mkdir -p ./build/Export
          APP_PATH="./build/Paytick.xcarchive/Products/Applications/Paytick.app"
          
          if [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" ./build/Export/
            echo "App copied successfully"
          else
            echo "ERROR: App not found at $APP_PATH"
            echo "Checking alternative locations..."
            find ./build/Paytick.xcarchive -name "*.app" -type d
            exit 1
          fi

      - name: Sign with Hardened Runtime
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
        run: |
          # Sign all frameworks first (if any)
          FRAMEWORKS_PATH="./build/Export/Paytick.app/Contents/Frameworks"
          if [ -d "$FRAMEWORKS_PATH" ]; then
            echo "Signing frameworks..."
            find "$FRAMEWORKS_PATH" -name "*.framework" -o -name "*.dylib" | while read framework; do
              codesign --force --options runtime \
                --sign "$CODE_SIGN_IDENTITY" \
                "$framework"
            done
          fi
          
          # Sign the main app with hardened runtime (required for notarization)
          codesign --deep --force --options runtime \
            --sign "$CODE_SIGN_IDENTITY" \
            --entitlements Paytick/Paytick/Paytick.entitlements \
            ./build/Export/Paytick.app
          
          # Verify the signature
          echo "=== Verifying signature ==="
          codesign --verify --verbose=4 ./build/Export/Paytick.app
          
          # Check for hardened runtime
          codesign -d --verbose=4 ./build/Export/Paytick.app 2>&1 | grep -i runtime || true

      - name: Notarize App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create zip for notarization
          ditto -c -k --keepParent ./build/Export/Paytick.app ./build/Paytick_notarize.zip
          
          # Submit for notarization and wait
          SUBMISSION_OUTPUT=$(xcrun notarytool submit ./build/Paytick_notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1) || true
          
          echo "$SUBMISSION_OUTPUT"
          
          # Extract submission ID
          SUBMISSION_ID=$(echo "$SUBMISSION_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          
          # Check if notarization failed
          if echo "$SUBMISSION_OUTPUT" | grep -q "status: Invalid"; then
            echo "Notarization failed. Fetching detailed log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi
          
          # Staple the notarization ticket to the app
          xcrun stapler staple ./build/Export/Paytick.app

      - name: Create DMG
        run: |
          hdiutil create -volname "Paytick" -srcfolder ./build/Export/ -ov -format UDZO Paytick.dmg

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: Paytick.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
